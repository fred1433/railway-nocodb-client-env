# Static page served under theaipipe.com/demos/railway-setup-check/
name = "railway-setup-check-demo"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [
  { pattern = "theaipipe.com/demos/railway-setup-check", zone_name = "theaipipe.com" },
  { pattern = "theaipipe.com/demos/railway-setup-check/*", zone_name = "theaipipe.com" }
]

[assets]
directory = "./site"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
run_worker_first = true
